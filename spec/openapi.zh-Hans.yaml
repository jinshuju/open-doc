# Chinese for the English text of openapi.yaml that the API pages show.
#
# Keyed by the English text itself, so a string the spec rewords comes back
# here with an empty `zh`. `npm run generate` adds what the pages newly need
# (in the order the pages use it) and drops what they no longer do; while a
# `zh` is empty the page shows the English and `npm run generate -- --check` fails.
# Write `zh` as Markdown, the way the spec writes `en`.

- en: Form token (`token` from `GET /forms`); a 24-character hexadecimal form id is also accepted.
  zh: 表单 token（`GET /forms` 返回的 `token`），也接受 24 位十六进制的表单 id。
- en: Name of the new form; when omitted, the server's default naming applies
  zh: 新表单名称；省略时沿用服务端默认命名
- en: Target folder token or id; when omitted, the copy is not put in a folder
  zh: 目标文件夹 token 或 id；省略则不放入文件夹
- en: Public fill URL of the form (built from the account's custom domain / subdomain; cannot be derived from the token)
  zh: 表单对外填写地址（按企业账户的自定义域名 / 子域名生成，不能由 token 推算）
- en: Form description (may be HTML rich text)
  zh: 表单描述（可能是 HTML 富文本）
- en: Fields in form order; each element is an object whose single key is the field's api_code
  zh: 字段列表，按表单中的顺序排列；每个元素是以字段 api_code 为唯一键的对象
- en: |
    Field definition. Every field has `label` / `api_code_alias` / `type` / `notes` / `private` / `validation`; the other properties appear according to `type`.

    How `type` values map to fields:
    | type | Field |
    |---|---|
    | `single_line_text` | Single-line text |
    | `paragraph_text` | Multi-line text |
    | `name` / `id_card` / `mobile` / `email` / `phone` / `link` / `address` / `geo_location` | Name / ID card / Mobile / Email / Phone / Website / Address / Geolocation |
    | `single_choice` / `multiple_choice` / `drop_down` / `cascade_drop_down` | Single choice / Multiple choice / Drop-down / Cascading drop-down (the color mark is also `drop_down`) |
    | `image_radio_button` / `image_check_box` | Image single choice / Image multiple choice |
    | `number` / `formula` / `rating` / `nps` / `boolean` | Number / Formula / Rating / NPS / Yes/No |
    | `date_time` / `date` / `time` | Date / Date (legacy) / Time |
    | `attachment` / `audio` / `e_signature` | File upload / Audio / E-signature |
    | `likert` / `matrix` / `matrix_scale` / `table` / `multiple_blanks` / `sort` | Matrix single choice / Matrix fill-in / Matrix scale / Table / Inline blanks / Ranking |
    | `goods` / `reservation` | Goods / Reservation |
    | `form_association` / `reversed_association` | Form association / Reverse association |
  zh: |
    字段定义。所有字段都有 `label` / `api_code_alias` / `type` / `notes` / `private` / `validation`，其余属性按 `type` 出现。

    `type` 取值与字段的对应关系：
    | type | 字段 |
    |---|---|
    | `single_line_text` | 单行文字 |
    | `paragraph_text` | 多行文字 |
    | `name` / `id_card` / `mobile` / `email` / `phone` / `link` / `address` / `geo_location` | 姓名 / 身份证 / 手机 / 邮箱 / 电话 / 网址 / 地址 / 地理位置 |
    | `single_choice` / `multiple_choice` / `drop_down` / `cascade_drop_down` | 单选 / 多选 / 下拉 / 多级下拉（颜色标记也是 `drop_down`） |
    | `image_radio_button` / `image_check_box` | 图片单选 / 图片多选 |
    | `number` / `formula` / `rating` / `nps` / `boolean` | 数字 / 计算 / 评分 / NPS / 是否 |
    | `date_time` / `date` / `time` | 日期 / 日期（旧）/ 时间 |
    | `attachment` / `audio` / `e_signature` | 上传文件 / 语音 / 电子签名 |
    | `likert` / `matrix` / `matrix_scale` / `table` / `multiple_blanks` / `sort` | 矩阵单选 / 矩阵填空 / 矩阵量表 / 表格 / 横向填空 / 排序 |
    | `goods` / `reservation` | 商品 / 预约 |
    | `form_association` / `reversed_association` | 表单关联 / 反向关联 |
- en: Form settings; an empty object when the form has no settings yet
  zh: 表单设置；表单尚无设置时为空对象
- en: The new form
  zh: 新建的表单
- en: Invalid request parameters or data
  zh: 请求参数或数据不合法
- en: "Unauthenticated: the token is invalid or revoked"
  zh: 未认证：令牌无效或已撤销
- en: The current plan does not include API v1
  zh: 当前套餐不包含 API v1 能力
- en: Insufficient OAuth scope (error_description shape), or the source form or its creator is frozen (errors + status_code shape)
  zh: OAuth scope 不足（error_description 结构），或源表单/创建者被冻结（errors + status_code 结构）
- en: The resource does not exist or is not accessible to the current identity (a personal token can access only the forms its user created or that were shared with that user)
  zh: 资源不存在或当前身份不可访问（个人令牌只能访问自己创建或被共享的表单）
- en: api_code of the attachment field; for an attachment column in a table field, pass the table field's api_code
  zh: 附件字段的 api_code；表格字段中的附件列则传表格字段的 api_code
- en: api_code of the attachment column in a table field; required when `field_api_code` is a table field
  zh: 表格字段中附件列的 api_code，`field_api_code` 为表格字段时必填
- en: One-time upload token, starting with `entry_att_tok_`; when passed, it replaces the regular credentials
  zh: 一次性上传令牌，以 `entry_att_tok_` 开头；传入时代替常规凭证
- en: File content as a Base64 string, optionally with a `data:<mime>;base64,` prefix, at most 5 MB once decoded; the `data` key also works
  zh: 文件内容的 Base64 字符串，可带 `data:<mime>;base64,` 前缀，解码后不超过 5 MB；亦可用 `data` 键
- en: Alias of `base64`
  zh: 与 `base64` 等价的别名
- en: File name, defaults to `attachment`; the `filename` key also works
  zh: 文件名，缺省为 `attachment`；亦可用 `filename` 键
- en: Alias of `file_name`
  zh: 与 `file_name` 等价的别名
- en: MIME type, defaults to the one in the data URI prefix, otherwise `application/octet-stream`
  zh: MIME 类型，缺省取 data URI 前缀，否则为 `application/octet-stream`
- en: Attachment ID; put it in an attachment field when creating / updating an entry
  zh: 附件 ID，创建 / 更新数据时填入附件字段
- en: File name
  zh: 文件名
- en: MIME type
  zh: MIME 类型
- en: File size in bytes
  zh: 文件字节数
- en: Download URL (long-lived)
  zh: 下载地址（长期有效）
- en: Image preview URL; returned only for image attachments
  zh: 图片预览地址，仅图片附件返回
- en: Uploaded
  zh: 上传成功
- en: "Forbidden: the OAuth token lacks the required scope, or a business rule refused the operation"
  zh: 无权限：OAuth 令牌 scope 不足，或操作被业务规则拒绝
- en: The attachment failed validation (for example, it exceeds the field's per-file size limit) or could not be stored
  zh: 附件未通过校验（如超过字段的单文件大小上限）或存储失败
- en: Folder name, cannot be empty
  zh: 文件夹名称，不能为空
- en: Folder kind; a folder holds one kind of content only, and tables go only into `table` folders. Defaults to `form`
  zh: 文件夹类型；一个文件夹只能放一类内容，表格只能放进 `table` 文件夹。缺省为 `form`
- en: Folder token
  zh: 文件夹 token
- en: Folder name
  zh: 文件夹名称
- en: "Folder kind: `form` holds forms, `table` holds tables; form folders created early on may have null, which is treated as `form`"
  zh: 文件夹类型：`form` 放表单、`table` 放表格；早期创建的表单文件夹可能为 null，按 `form` 对待
- en: Created at (UTC)
  zh: 创建时间（UTC）
- en: Created
  zh: 创建成功
- en: Form name
  zh: 表单名称
- en: Form description
  zh: 表单描述
- en: A form field definition, branched on type; each branch takes only the attributes of that type
  zh: 表单字段定义，按 type 分支；各分支只接受该类型的属性
- en: |
    The `setting` used when creating / editing a form. Only the keys below are accepted; other keys are ignored. A write describes the resulting state: omitted keys keep their current values, and `null` clears a key.
    - Passing only `success_message` automatically sets `success_message_style` to `text`; passing only `success_message_rich_text` sets it to `rich_text`.
    - `submission_region_limited=true` requires a plan that includes "Submission region limit" and at least one item in `submission_regions`.
    - `merchant_account_id` (小金商户) cannot be bound together with `wxpay_account_id` / `alipay_account_id`; a newly passed payment account must belong to the current account, and once bound, `payment_way` becomes `third_party` automatically.
    - `notification_rules` replaces all notification rules created through the API as a whole (`[]` clears them); rules created in the desktop UI are not affected.
  zh: |
    创建 / 编辑表单时的 `setting`，只接受以下键，其他键忽略。写入的是「结果状态」：省略的键保持原值，传 `null` 表示清除。
    - 只传 `success_message` 会自动把 `success_message_style` 设为 `text`；只传 `success_message_rich_text` 则设为 `rich_text`。
    - `submission_region_limited=true` 需要套餐包含「填写地域限制」，且 `submission_regions` 至少一项。
    - `merchant_account_id`（小金商户）不能与 `wxpay_account_id` / `alipay_account_id` 同时绑定；新传入的支付账户必须属于当前企业账户，绑定后 `payment_way` 自动为 `third_party`。
    - `notification_rules` 整体替换由 API 创建的通知规则（传 `[]` 即清空），不影响桌面端创建的规则。
- en: Token (or id) of the folder to put it in; you must be able to manage the folder, and its kind must be form
  zh: 放入的文件夹 token（或 id），必须可管理且 kind 为 form
- en: Form scene; a plain form by default
  zh: 表单场景，缺省为普通表单
- en: Layout; applies only when scene is survey / form / exam / evaluation; card is the paged layout
  zh: 布局，仅 survey / form / exam / evaluation 场景有效；card 为分页式
- en: Created; returns the form structure
  zh: 创建成功，返回表单结构
- en: The folder named by folder_token does not exist or cannot be managed
  zh: folder_token 指定的文件夹不存在或不可管理
- en: Rate limit exceeded
  zh: 超过速率限制
- en: |
    Field values for writing an entry, keyed by field api_code or api_code_alias. Unknown keys and non-writable fields (signature, formula) are ignored.
    Choice fields take the choice api_code or the choice label; see the table below for cascading drop-downs and choice extra text. Number fields accept a number or a numeric string.

    | Field | How to write |
    |---|---|
    | Single-line / multi-line text, name, mobile, email, phone, website, ID card | String |
    | Single choice, drop-down | `"choice api_code"` or `"choice label"`; extra text via `"<api_code>_extended_text": {"<choice>": "extra text"}`, "Other" text via `"<api_code>_other": "..."` |
    | Multiple choice | Array, items as above |
    | Image single choice / image multiple choice | Choice api_code (string / array) |
    | Cascading drop-down | `{"level_1": "...", "level_2": "..."}` (api_code or label) |
    | Number, rating, NPS | Number |
    | Yes/No | Boolean |
    | Date | `"2012-12-25"` or `"2012-12-25 12:13:15"` (Beijing time, UTC+8) |
    | Time | `{"hour": "12", "minute": "15"}` |
    | Address | `{"province","city","district","street"}` |
    | Geolocation | `{"longitude","latitude","address"}` |
    | File upload (multiple allowed) | Array; each item is one of: the id of an uploaded attachment; the download URL of an attachment already on this form (to keep it); `{"base64": "...", "file_name": "a.png", "content_type": "image/png"}` (≤ 5MB; `base64` may also be a data URI); `{"attachment_token": "..."}` (pre-upload token) |
    | Goods | `[{"value": "goods item api_code", "number": 2, "specification": {"spec dimension": "option"}?}]` |
    | Matrix fill-in / matrix scale | `{"<statement api_code>": {"<column api_code>": value}}` |
    | Matrix single choice | `{"<statement api_code>": "choice api_code"}` |
    | Table | `[{"<column api_code>": value}, ...]`; attachment columns are written like file upload |
    | Inline blanks | `{"<sub-field api_code>": "..."}` |
    | Ranking | Ordered array `["choice api_code", ...]` |
    | Form association | token / id of the associated entry, or a display value matched by the association key (an array for multiple association keys) |
    | Reservation | `[{"api_code": "item", "scheduled_at": "2021-04-26", "end_at"?: "...", "number": 1}]` |
    | Color mark | `"color_mark": "<color api_code or name>"` |
    | International mobile number | Also pass `"<api_code>_country_id"` / `"<api_code>_country_code"` |
  zh: |
    写入数据时的字段值，键为字段 api_code 或 api_code_alias。未知键与不可写字段（签名、计算）被忽略。
    选项类字段可传选项 api_code 或显示值，多级下拉与选项补充文本见下表；数字字段接受数字或数字字符串。

    | 字段 | 写法 |
    |---|---|
    | 单行 / 多行文字、姓名、手机、邮箱、电话、网址、身份证 | 字符串 |
    | 单选、下拉 | `"选项 api_code"` 或 `"选项显示值"`；补充文本用 `"<api_code>_extended_text": {"<选项>": "补充"}`，「其他」文本用 `"<api_code>_other": "..."` |
    | 多选 | 数组，元素同上 |
    | 图片单选 / 图片多选 | 选项 api_code（字符串 / 数组） |
    | 多级下拉 | `{"level_1": "...", "level_2": "..."}`（api_code 或显示值） |
    | 数字、评分、NPS | 数字 |
    | 是否 | 布尔 |
    | 日期 | `"2012-12-25"` 或 `"2012-12-25 12:13:15"`（北京时间） |
    | 时间 | `{"hour": "12", "minute": "15"}` |
    | 地址 | `{"province","city","district","street"}` |
    | 地理位置 | `{"longitude","latitude","address"}` |
    | 上传文件（可多个） | 数组，元素可为：已上传附件的 id；本表单已有附件的下载地址（用于保留）；`{"base64": "...", "file_name": "a.png", "content_type": "image/png"}`（≤ 5MB，`base64` 也可为 data URI）；`{"attachment_token": "..."}`（预上传令牌） |
    | 商品 | `[{"value": "商品 api_code", "number": 2, "specification": {"规格维度": "选项"}?}]` |
    | 矩阵填空 / 矩阵量表 | `{"<题目 api_code>": {"<列 api_code>": 值}}` |
    | 矩阵单选 | `{"<题目 api_code>": "选项 api_code"}` |
    | 表格 | `[{"<列 api_code>": 值}, ...]`，附件列写法同上传文件 |
    | 横向填空 | `{"<子字段 api_code>": "..."}` |
    | 排序 | 有序数组 `["选项 api_code", ...]` |
    | 表单关联 | 关联数据的 token / id，或用关联键匹配的显示值（多个关联键传数组） |
    | 预约 | `[{"api_code": "项目", "scheduled_at": "2021-04-26", "end_at"?: "...", "number": 1}]` |
    | 颜色标记 | `"color_mark": "<颜色 api_code 或名称>"` |
    | 国际手机号 | 另传 `"<api_code>_country_id"` / `"<api_code>_country_code"` |
- en: Index in the request array
  zh: 请求数组中的下标
- en: At least one entry created
  zh: 至少一条创建成功
- en: The form's entry count has reached its limit, or the OAuth scope is insufficient
  zh: 表单数据量已达上限，或 OAuth scope 不足
- en: All entries failed to be created
  zh: 全部条目创建失败
- en: Form token
  zh: 表单 token
- en: |
    One entry. Keys are field api_codes (a field with an api_code_alias is keyed by the alias), plus these system keys:
    `token`, `serial_number`, `created_at`, `updated_at`, `creator_name` (submitter's name), `color_mark` (color mark),
    `info_filling_duration` (time spent filling in, seconds), `info_platform`, `info_os`, `info_browser`, `info_region` (`{country, province, city}`), `info_remote_ip`,
    and, depending on the form's features, `gen_code` (confirmation code), `total_price` / `preferential_price` (when there are goods), `x_field_weixin_*` (WeChat info), `referral_link` and others.
    Exam / evaluation questions also add `<api_code>_extra_value: { correct_answer, score }`; reverse association fields add `<api_code>_entries`, and association fields add `<api_code>_related_entries`.

    Value shape by field type:
    | Field | Value |
    |---|---|
    | Single-line / multi-line text, name, mobile, email, phone, website, ID card | String |
    | Single choice, drop-down, image single choice | Choice label (string) |
    | Multiple choice, image multiple choice | Array of choice labels |
    | Cascading drop-down | `{"level_1": "...", "level_2": "..."}` |
    | Number, rating, NPS, formula | Number (a rating may be a string) |
    | Yes/No | Boolean |
    | Date | Beijing time (UTC+8) string formatted to the field's precision, e.g. `2021-09-23` |
    | Time | `HH:MM` or `HH:MM:SS` |
    | File upload | Array of download URLs (signed, valid for 10 years) |
    | E-signature | Download URL string |
    | Audio | `{"url": "...", "audio_text": "..."}` |
    | Address | `{"province","city","district","street"}` |
    | Geolocation | `{"longitude","latitude","address"}` |
    | Goods | `[{"name","number","price","original_price","inventory","layout","spec"?}]` |
    | Matrix fill-in / matrix scale | `[{"statement": "statement label", "dimensions": {"column name": value}}]` |
    | Matrix single choice | `[{"statement": "statement label", "choice": "choice label"}]` (the multiple-choice style has a `choices` array) |
    | Table | `[{"column name": value}]` (one object per row, empty values omitted) |
    | Inline blanks | `{"<sub-field api_code>": "..."}` |
    | Ranking | `[{"rank": 1, "choice": "choice label"}]` |
    | Reservation | `[{"item_name","scheduled_label","number", ...}]` |
    | Form association | Display value string of the associated entry |
    | Association (table) | Array of serial numbers of the linked entries in the associated table, e.g. `[1, 3]`; plus `<api_code>_related_entries`: `[{"serial_number": 1, "value": "..."}]`, where value is that entry's first-column value |
    When the request has `include_labels=true`, form field values are wrapped as `{label, value}`.
  zh: |
    一条数据。键为字段 api_code（配置了 api_code_alias 的字段以别名为键），另有以下系统键：
    `token`、`serial_number`、`created_at`、`updated_at`、`creator_name`（提交人姓名）、`color_mark`（颜色标记）、
    `info_filling_duration`（填写时长，秒）、`info_platform`、`info_os`、`info_browser`、`info_region`（`{country, province, city}`）、`info_remote_ip`，
    以及按表单能力出现的 `gen_code`（确认码）、`total_price` / `preferential_price`（有商品时）、`x_field_weixin_*`（微信信息）、`referral_link` 等。
    考试 / 测评题目还会多出 `<api_code>_extra_value: { correct_answer, score }`；反向关联字段多出 `<api_code>_entries`，关联字段多出 `<api_code>_related_entries`。

    各类型字段值的形态：
    | 字段 | 值 |
    |---|---|
    | 单行 / 多行文字、姓名、手机、邮箱、电话、网址、身份证 | 字符串 |
    | 单选、下拉、图片单选 | 选项显示值（字符串） |
    | 多选、图片多选 | 选项显示值数组 |
    | 多级下拉 | `{"level_1": "...", "level_2": "..."}` |
    | 数字、评分、NPS、计算 | 数字（评分可能为字符串） |
    | 是否 | 布尔 |
    | 日期 | 按精度格式化的北京时间字符串，如 `2021-09-23` |
    | 时间 | `HH:MM` 或 `HH:MM:SS` |
    | 上传文件 | 下载地址数组（带签名，10 年有效） |
    | 电子签名 | 下载地址字符串 |
    | 语音 | `{"url": "...", "audio_text": "..."}` |
    | 地址 | `{"province","city","district","street"}` |
    | 地理位置 | `{"longitude","latitude","address"}` |
    | 商品 | `[{"name","number","price","original_price","inventory","layout","spec"?}]` |
    | 矩阵填空 / 矩阵量表 | `[{"statement": "题目", "dimensions": {"列名": 值}}]` |
    | 矩阵单选 | `[{"statement": "题目", "choice": "选项"}]`（多选样式为 `choices` 数组） |
    | 表格 | `[{"列名": 值}]`（每行一个对象，空值省略） |
    | 横向填空 | `{"<子字段 api_code>": "..."}` |
    | 排序 | `[{"rank": 1, "choice": "选项"}]` |
    | 预约 | `[{"item_name","scheduled_label","number", ...}]` |
    | 表单关联 | 关联数据的显示值字符串 |
    | 关联（表格） | 关联表格中被关联数据的序号数组，如 `[1, 3]`；另附 `<api_code>_related_entries`：`[{"serial_number": 1, "value": "..."}]`，value 为该数据第一列的值 |
    请求带 `include_labels=true` 时，表单字段的值包装为 `{label, value}`。
- en: Unique identifier of the entry
  zh: 数据唯一标识
- en: URL that opens this entry in Jinshuju's data page (the data page for a form, the table page for a table, scrolled to this serial number), for users to check against. Appears only in responses that get, create or update a single entry; list and batch endpoints do not return it; entries of quick payment forms have no such key.
  zh: 该条数据在金数据数据页中的打开地址（表单为数据页、表格为表格页，定位到该条序号），给用户核对用。只在获取、新增、更新单条数据的响应中出现；列表与批量接口不返回；快捷收款表单的数据没有该键。
- en: Created; returns the entry
  zh: 创建成功，返回该条数据
- en: 'Entry validation failed or a parameter is invalid. When field validation fails, `error_description` is a JSON string serialized from `{ "<api_code>": ["error message"] }`'
  zh: '数据校验失败或参数不合法。字段校验失败时 `error_description` 是 `{ "<api_code>": ["错误信息"] }` 序列化后的 JSON 字符串'
- en: The form's entry count has reached its limit (`Form has reached entries limit`), or the OAuth scope is insufficient
  zh: 表单数据量已达上限（`Form has reached entries limit`），或 OAuth scope 不足
- en: View name, cannot be empty
  zh: 视图名称，不能为空
- en: View type, defaults to grid on create; form is a form view (a public fill page), supported by tables only
  zh: 视图类型，创建时默认 grid；form 为表单视图（对外填写页），仅表格支持
- en: Visibility, defaults to cooperators on create; on update only the creator can switch it
  zh: 可见性，创建时默认 cooperators；更新时只有创建者可切换
- en: api_codes of the fields shown
  zh: 显示的字段 api_code 列表
- en: api_code of the kanban grouping field; must be a field that supports kanban grouping
  zh: 看板分组字段 api_code，必须是支持看板分组的字段
- en: api_code of the kanban card title field
  zh: 看板卡片标题字段 api_code
- en: Display order of kanban groups; elements must be non-empty, unique strings
  zh: 看板分组显示顺序，元素须为非空且不重复的字符串
- en: Hidden kanban groups; elements must be non-empty, unique strings; an empty array shows all groups
  zh: 隐藏的看板分组，元素须为非空且不重复的字符串；传空数组表示显示全部分组
- en: Sort rules, replaced as a whole
  zh: 排序规则，整体替换
- en: api_code of the sort field
  zh: 排序字段 api_code
- en: Sort direction
  zh: 排序方向
- en: Column display order, replaced as a whole; position is generated from 1 in array order
  zh: 列显示顺序，整体替换，position 按数组顺序从 1 生成
- en: Field api_code
  zh: 字段 api_code
- en: Array of filters, replaced as a whole; an empty array clears the filters; returns 422 when it is not an array
  zh: 筛选条件数组，整体替换；传空数组清空筛选；不是数组时返回 422
- en: Field api_code (api_code / trigger are also accepted as the key name)
  zh: 字段 api_code（也接受 api_code / trigger 作为键名）
- en: "Operator, the same as the entry list filters: eq, ne, any_in, none_in, between, not_between, null, not_null, gte, gt, lte, lt, like, not_like, match, within_last; the aliases start / end / equal / not_equal are equivalent to gte / lte / eq / ne respectively. The server decides which subset each field type supports. On choice fields, eq / ne are saved as any_in / none_in and the value is turned into an array."
  zh: 运算符，与数据列表 filters 相同：eq、ne、any_in、none_in、between、not_between、null、not_null、gte、gt、lte、lt、like、not_like、match、within_last； 别名 start / end / equal / not_equal 分别等价于 gte / lte / eq / ne。每种字段支持的子集以服务端为准。 选项类字段的 eq / ne 保存时会转为 any_in / none_in 且值转为数组。
- en: 'Condition value; its type depends on the field and the operator: a two-element array for between; {"unit": "day", "n": 30} for within_last (unit can be minute / day / week / month); on choice fields, pass choice api_codes or choice texts, with "null" meaning not filled in; null / not_null take no value.'
  zh: '条件值，类型随字段与运算符而定：between 为两元素数组；within_last 为 {"unit": "day", "n": 30}（unit 可为 minute / day / week / month）； 选项类字段可传选项 api_code 或选项文本，"null" 表示未填写；null / not_null 无需 value。'
- en: Fill page title, cannot be empty; defaults to the table name on create. Form views (view_type=form) only; on other view types it returns 422.
  zh: 填写页标题，不能为空；创建时缺省为表格名称。仅表单视图（view_type=form）可用，用在其他类型上返回 422。
- en: Fill page description. Form views (view_type=form) only; on other view types it returns 422.
  zh: 填写页描述。仅表单视图（view_type=form）可用，用在其他类型上返回 422。
- en: Whether the fill page is published, defaults to false on create. Form views (view_type=form) only; on other view types it returns 422.
  zh: 是否发布填写页，创建时缺省 false。仅表单视图（view_type=form）可用，用在其他类型上返回 422。
- en: Fill item settings, replaced as a whole; when omitted on create, every fillable column is checked in the current column order. Form views (view_type=form) only; on other view types it returns 422.
  zh: 填写项配置，整体替换；创建时不传则按当前列顺序勾选全部可填写的列。仅表单视图（view_type=form）可用，用在其他类型上返回 422。
- en: The column's api_code; the column must exist and be usable as a fill item, and cannot repeat within one request
  zh: 列的 api_code；列必须存在且可作为填写项，同一请求中不能重复
- en: Label on the fill page; falls back to the column label when empty
  zh: 填写页上的标题；为空时沿用列标题
- en: Notes on the fill page; falls back to the column notes when empty
  zh: 填写页上的说明；为空时沿用列说明
- en: When true, hidden from the fill page; when not passed, follows the column's own setting
  zh: 为 true 时不出现在填写页；不传时沿用列自身设置
- en: Position on the fill page; when not passed, the array order
  zh: 在填写页中的顺序；不传时按数组顺序
- en: Validations of this fill item; currently `presence` marks it required. Each must be a validation the column type supports (e.g. yes/no and formula columns cannot be made required); otherwise returns 422
  zh: 该填写项的校验，目前用 `presence` 表示必填；必须是该列类型支持的校验（如是否列、计算列不能设为必填），否则 422
- en: Client identifier, passed through in the real-time change broadcast (defined by the server implementation)
  zh: 客户端标识，随实时变更广播透传（以服务端实现为准）
- en: View token
  zh: 视图 token
- en: View name
  zh: 视图名称
- en: View type; form is a form view (a public fill page, tables only)
  zh: 视图类型；form 为表单视图（对外填写页，仅表格支持）
- en: Position in the order of views
  zh: 排序位置
- en: Whether it is a predefined view (cannot be deleted)
  zh: 是否为预置视图（不可删除）
- en: "Visibility: cooperators means visible to all cooperators, personal means visible only to the creator"
  zh: 可见性，cooperators 对全部协作者可见，personal 仅创建者可见
- en: What the view belongs to; form means it belongs to the form itself (cannot be deleted, and its visibility cannot be switched)
  zh: 视图归属，form 表示属于表单本身（不可删除、不可切换可见性）
- en: Column display order, by position ascending
  zh: 列显示顺序，按 position 升序
- en: Column position, starting at 1
  zh: 列位置，从 1 开始
- en: api_code of the kanban grouping field
  zh: 看板分组字段 api_code
- en: api_code of the kanban card title field; when not set, the server derives it from prefer_columns
  zh: 看板卡片标题字段 api_code，未设置时由服务端根据 prefer_columns 推算
- en: Display order of kanban groups (api_codes of the grouping choices; `__unset__` means no group set)
  zh: 看板分组显示顺序（分组选项 api_code，`__unset__` 表示未设置分组）
- en: Hidden kanban groups (same values as kanban_group_order)
  zh: 隐藏的看板分组（同 kanban_group_order 的取值）
- en: api_code of the field at the frozen-column boundary in a grid view
  zh: 表格视图冻结列边界字段 api_code
- en: Sort rules
  zh: 排序规则
- en: Filters; an empty array when there are none
  zh: 筛选条件，无筛选时为空数组
- en: Created at
  zh: 创建时间
- en: Updated at
  zh: 更新时间
- en: Fill page title (returned for form views only)
  zh: 填写页标题（仅表单视图返回）
- en: Fill page description (returned for form views only)
  zh: 填写页描述（仅表单视图返回）
- en: Whether it is published; the fill link does not work while unpublished (returned for form views only)
  zh: 是否已发布；未发布时填写链接不可用（仅表单视图返回）
- en: Public fill link (returned for form views only)
  zh: 对外填写链接（仅表单视图返回）
- en: Fill items checked on the fill page, in fill page order, with their effective values (returned for form views only)
  zh: 填写页上勾选的填写项，按填写页顺序，值为生效值（仅表单视图返回）
- en: The column's api_code
  zh: 列的 api_code
- en: Label shown on the fill page (the column label unless set separately)
  zh: 填写页上显示的标题（未单独设置时为列标题）
- en: Notes shown on the fill page (the column notes unless set separately)
  zh: 填写页上显示的说明（未单独设置时为列说明）
- en: Whether it is required
  zh: 是否必填
- en: Created; returns the view
  zh: 创建成功，返回视图
- en: The request cannot be processed (view limit reached, invalid filters, model validation failure, deletion not allowed, etc.); the body is { error_description }
  zh: 请求无法处理（视图数量达到上限、筛选条件不合法、模型校验失败、不允许删除等），响应体为 { error_description }
- en: Token of the form the query belongs to (can also be passed as a query parameter)
  zh: 所属表单的 token（也可作为 query 参数传递）
- en: Name, cannot be empty
  zh: 名称，不能为空
- en: Description text
  zh: 说明文字
- en: Whether it is enabled
  zh: 是否启用
- en: Search field rules, replaced as a whole; when given, cannot be an empty array, and each rule's search_field_settings cannot be empty
  zh: 查询字段规则，整体替换；传入时不能为空数组，每条规则的 search_field_settings 不能为空
- en: How the search fields within the rule are combined
  zh: 规则内各查询字段的组合方式
- en: Search field settings, cannot be empty
  zh: 查询字段设置，不能为空
- en: api_code of the search field; must be a field the form allows searching on
  zh: 查询字段 api_code，必须是表单可查询的字段
- en: Field label shown to the public; the field's own label is used when empty
  zh: 对外显示的字段标签，为空时用字段原标签
- en: Whether to use fuzzy matching
  zh: 是否模糊匹配
- en: Whether SMS verification is required (applies to mobile fields only)
  zh: 是否需要短信验证（仅对手机字段生效）
- en: Display field rules, replaced as a whole; when given, cannot be an empty array
  zh: 展示字段规则，整体替换；传入时不能为空数组
- en: api_code of the display field; must be a field the form allows displaying
  zh: 展示字段 api_code，必须是表单可展示的字段
- en: Whether the searcher can edit this field on the results page
  zh: 查询者是否可在结果页编辑该字段
- en: Whether privacy protection is on (masked display; applies only to fields that support privacy protection)
  zh: 是否隐私保护（脱敏显示，仅对支持隐私保护的字段生效）
- en: Highlight settings; null when not set
  zh: 高亮设置，未设置时为 null
- en: Highlight color
  zh: 高亮颜色
- en: Highlight sort position
  zh: 高亮排序位置
- en: Search button settings; only text and color are read
  zh: 查询按钮设置，只读取 text 与 color
- en: Button text
  zh: 按钮文字
- en: Button color
  zh: 按钮颜色
- en: Prompt messages; only has_result and no_result are read; missing keys use the product defaults
  zh: 提示文案，只读取 has_result 与 no_result；缺省的键使用产品默认文案
- en: Message shown when results are found
  zh: 查到结果时的提示
- en: Message shown when no results are found
  zh: 未查到结果时的提示
- en: Whether the searcher may export results
  zh: 是否允许查询者导出结果
- en: Header settings; only attachment_id, image_upload_token, position_x and position_y of background_image are read (defined by the server implementation)
  zh: 页头设置，只读取 background_image 的 attachment_id、image_upload_token、position_x、position_y（以服务端实现为准）
- en: Background image attachment id, returned by "Upload a form image" (`POST /form_image_attachments`, `image_type=opensearch_header`)
  zh: 背景图附件 id，由「上传表单图片」（`POST /form_image_attachments`，`image_type=opensearch_header`）返回
- en: "Instead of attachment_id: after uploading with a `form_image_token` (purpose opensearch_header), pass that token directly. The token must be uploaded, unexpired, owned by the caller and have the purpose opensearch_header; otherwise returns 400"
  zh: 代替 attachment_id：以 `form_image_token`（用途为 opensearch_header）上传后，直接传这个令牌。令牌须已上传、未过期、属于调用者且用途为 opensearch_header，否则返回 400
- en: Horizontal position of the background image
  zh: 背景图横向位置
- en: Vertical position of the background image
  zh: 背景图纵向位置
- en: Extra settings (defined by the server implementation)
  zh: 额外设置（以服务端实现为准）
- en: Whether to show the correct exam answers
  zh: 是否显示考试正确答案
- en: Whether to show the exam explanations
  zh: 是否显示考试解析
- en: Conditions that limit which entries can be searched; require plan support, otherwise returns 400; only trigger, operator, value, group_index and scope_attr are read from each item
  zh: 限定可查询数据范围的条件，需要套餐支持，否则返回 400；每项只读取 trigger、operator、value、group_index、scope_attr
- en: api_code of the trigger field
  zh: 触发字段 api_code
- en: Operator (defined by the server implementation)
  zh: 运算符（以服务端实现为准）
- en: Condition value
  zh: 条件值
- en: Condition group index; conditions in the same group are combined with and, different groups with or
  zh: 条件分组序号，同组为 and，不同组为 or
- en: Attribute the condition applies to (defined by the server implementation)
  zh: 条件作用的属性（以服务端实现为准）
- en: Public query token
  zh: 对外查询 token
- en: Public URL of the public query (/os/{token}, on the account subdomain or a custom domain)
  zh: 对外查询公开访问地址（/os/{token}，使用账户子域名或自定义域名）
- en: Name
  zh: 名称
- en: Token of the form it belongs to; null when the form has been deleted
  zh: 所属表单 token，表单已删除时为 null
- en: Total number of searches
  zh: 累计查询次数
- en: Total number of visits
  zh: 累计访问次数
- en: "Status: active means usable; entries_count_limited means the form's entry count exceeds the plan's public query limit; form_not_found means the form has been deleted"
  zh: 状态：active 可用；entries_count_limited 表单数据量超过套餐对外查询上限；form_not_found 表单已删除
- en: Search field rules
  zh: 查询字段规则
- en: Display field rules
  zh: 展示字段规则
- en: Saved raw values of the prompt messages; an empty object or null when not customized
  zh: 已保存的提示文案原始值，未自定义时为空对象或 null
- en: Prompt messages with the product defaults merged in (in the form's language)
  zh: 合并产品默认文案后的提示文案（按表单语言）
- en: Search button settings; an empty object when not set
  zh: 查询按钮设置，未设置时为空对象
- en: Header settings
  zh: 页头设置
- en: Header background image; null when not set
  zh: 页头背景图，未设置时为 null
- en: Background image attachment id
  zh: 背景图附件 id
- en: Background image URL
  zh: 背景图地址
- en: Created; returns the public query details
  zh: 创建成功，返回对外查询详情
- en: Entry serial number
  zh: 数据序号
- en: Deleted
  zh: 删除成功
- en: Token of the deleted view
  zh: 被删除视图的 token
- en: Account ID
  zh: 账号 ID
- en: Account name
  zh: 账号名称
- en: Custom subdomain
  zh: 自定义子域名
- en: Number of active members
  zh: 活跃成员数
- en: Plan code (e.g. free, pro2, ent2, e10, e20, e30, en_cor)
  zh: 套餐代码（如 free、pro2、ent2、e10、e20、e30、en_cor）
- en: Plan name
  zh: 套餐名称
- en: Plan end date (YYYY-MM-DD); an empty string when there is no end date
  zh: 套餐到期日（YYYY-MM-DD），无到期日时为空字符串
- en: Whether it is an organization plan
  zh: 是否企业套餐
- en: Whether the organization plan has expired
  zh: 企业套餐是否已到期
- en: Usage this month; keys are add-on service codes (sms, active_mail, entry_quota, storage_quota, ai_points, audio_quota, entry_transaction_quota, merchant_entry_transaction_quota)
  zh: 当月用量；键为增值服务代码（sms、active_mail、entry_quota、storage_quota、ai_points、audio_quota、entry_transaction_quota、merchant_entry_transaction_quota）
- en: Next usage reset date (YYYY-MM-DD)
  zh: 下次用量重置日（YYYY-MM-DD）
- en: Quota and usage of one add-on service; when the quota is unlimited, only unit, unlimited and consumed_quota are present
  zh: 单项增值服务的配额与用量；配额无限时只有 unit、unlimited、consumed_quota
- en: Unit of measure
  zh: 计量单位
- en: true when the quota is unlimited
  zh: 配额无限时为 true
- en: Total quota this month (included in the plan + purchased)
  zh: 本月总配额（套餐赠送 + 已购）
- en: Total remaining quota
  zh: 剩余总额度
- en: Remaining part of this month's plan-included quota
  zh: 本月套餐赠送额度的剩余
- en: Consumed this month
  zh: 本月已消耗
- en: Whether a feature trial is in progress
  zh: 是否正在功能试用中
- en: Whether the feature trial has ended
  zh: 功能试用是否已结束
- en: Name of the trial plan
  zh: 试用套餐名称
- en: Trial end date (YYYY-MM-DD); an empty string when no trial has been taken
  zh: 试用截止日（YYYY-MM-DD），未试用过时为空字符串
- en: Bound payment merchants
  zh: 已绑定的收款商户
- en: Merchant number
  zh: 商户号
- en: Enabled payment channels (wxpay / alipay)
  zh: 已开通的支付渠道（wxpay / alipay）
- en: Bound WeChat Pay accounts
  zh: 已绑定的微信支付账户
- en: Bound Alipay accounts
  zh: 已绑定的支付宝账户
- en: Account details
  zh: 账号信息
- en: Maximum number to return; defaults to 50, at most 100
  zh: 返回数量上限，缺省 50，最大 100
- en: Total number of members
  zh: 成员总数
- en: Number returned this time
  zh: 本次返回的数量
- en: User ID
  zh: 用户 ID
- en: Display name
  zh: 显示名称
- en: Email
  zh: 邮箱
- en: Mobile number
  zh: 手机号
- en: Role in the account
  zh: 在账号中的角色
- en: Member status
  zh: 成员状态
- en: Joined at (UTC)
  zh: 加入时间（UTC）
- en: Member list
  zh: 成员列表
- en: Total number of folders the user can manage
  zh: 可管理的文件夹总数
- en: Folder list
  zh: 文件夹列表
- en: Whether to include `analytics` on each analysable field (the aggregate functions available, whether it can be grouped by, the shape of its summary). Defaults to false.
  zh: 是否在每个可分析字段上附带 `analytics`（可用的聚合函数、能否分组、数据概况形态），缺省为 false。
- en: When `true`, includes `theme` (the form theme).
  zh: 为 `true` 时附带 `theme`（表单主题）。
- en: When `true`, includes `field_rules` (field display rules, the same as the `data` of `GET /forms/{form_token}/field_rules`).
  zh: 为 `true` 时附带 `field_rules`（字段显示规则，同 `GET /forms/{form_token}/field_rules` 的 `data`）。
- en: When `true`, includes `extended_attributes` (source-tracking links, the same as the `data` of `GET /forms/{form_token}/extended_attributes`).
  zh: 为 `true` 时附带 `extended_attributes`（数据来源链接，同 `GET /forms/{form_token}/extended_attributes` 的 `data`）。
- en: When `true`, forms bound to a payment account (merchant account / WeChat Pay / Alipay) carry `transactions` payment statistics; unbound forms have no such key. Not included by default.
  zh: 为 `true` 时，已绑定收款账户（商户号 / 微信支付 / 支付宝）的表单附带 `transactions` 收款统计；未绑定的表单没有该键。缺省不附带。
- en: Form theme (present when `include_theme=true`); same shape as `FormTheme`, but without `form_token`. An empty object when the form has no theme
  zh: 表单主题（`include_theme=true` 时出现）；结构同 `FormTheme`，但不含 `form_token`。表单没有主题时为空对象
- en: Field display rules (present when `include_field_rules=true`), same as `data` of `GET /forms/{form_token}/field_rules`
  zh: 字段显示规则（`include_field_rules=true` 时出现），同 `GET /forms/{form_token}/field_rules` 的 `data`
- en: 0-based position, used by PATCH /forms/{form_token} to update or remove the rule
  zh: 0 起始位置，用于 PATCH /forms/{form_token} 更新或删除规则
- en: api_codes of the controlled fields; always ["DYNAMIC_TARGETS"] when targets_display_mode is abort
  zh: 受控字段的 api_code；targets_display_mode 为 abort 时固定为 ["DYNAMIC_TARGETS"]
- en: "show: show the target fields when the conditions are met; abort: end the fill when the conditions are met"
  zh: show 满足条件时显示目标字段；abort 满足条件时终止填写
- en: Logical relation between the conditions
  zh: 多个条件之间的逻辑关系
- en: equal means "contains any of" (for historical reasons)
  zh: equal 表示"包含任一"（历史原因）
- en: "Condition value: an array of choice api_codes, a numeric range [min, max] or text, depending on the trigger field's type"
  zh: 条件值：选项 api_code 数组、数值范围 [min, max] 或文本，取决于触发字段类型
- en: Source-tracking links (present when `include_extended_attributes=true`), same as `data` of `GET /forms/{form_token}/extended_attributes`
  zh: 数据来源链接（`include_extended_attributes=true` 时出现），同 `GET /forms/{form_token}/extended_attributes` 的 `data`
- en: Extended attribute value
  zh: 扩展属性值
- en: Fill link carrying this value
  zh: 携带该值的填写链接
- en: Whether the link uses a custom domain
  zh: 链接是否使用自定义域名
- en: |
    Payment statistics, grouped by transaction status (present when `include_transactions=true` and the form is bound to a payment account). Only the `paid` group exists for now:
    entries whose transaction status is paid or refunding, summed by order total (refunds not deducted); refunded and partially refunded entries are not counted. This is not a net income report.
    An amount of 0 does not mean the form is not a payment form.
  zh: |
    收款统计，按交易状态分组（`include_transactions=true` 且表单绑定了收款账户时出现）。目前只有 `paid` 一组：
    交易状态为已支付或退款中的数据，按订单总额累计（不扣除退款）；已退款与部分退款的数据不计入。这不是净收入报表。
    金额为 0 不代表不是收款表单。
- en: Sum of the order totals of this group's entries, in yuan (CNY)
  zh: 该组数据的订单总额之和（元）
- en: Number of entries in this group
  zh: 该组数据的条数
- en: Form structure
  zh: 表单结构
- en: User id
  zh: 用户 id
- en: User display name
  zh: 用户显示名
- en: Role name
  zh: 角色名称
- en: List of cooperators
  zh: 协作者列表
- en: Return only these fields. A JSON array, a comma-separated string or a repeated parameter, of field api_codes; the serial number is always returned. Returns 400 listing the available fields when an api_code is unknown.
  zh: 只返回指定字段。JSON 数组、逗号分隔字符串或重复参数均可，值为字段 api_code；序号始终返回。含未知 api_code 时返回 400 并列出可用字段。
- en: |
    Filters, a JSON array of `{"field": "<api_code>", "operator": "<op>", "value": ...}` items (`field` can also be written as `api_code` / `trigger`); conditions are combined with AND.
    - All operators: `eq` `ne` `any_in` `none_in` `between` `not_between` `null` `not_null` `gte` `gt` `lte` `lt` `like` `not_like` `within_last`,
      aliases `equal` / `not_equal` / `start` (=gte) / `end` (=lte). Each field type accepts only some of them; an unsupported one returns 400 listing the available operators.
    - For choice fields (single choice / multiple choice / drop-down / cascading drop-down), `value` can be a choice api_code or a choice label; a cascading drop-down also accepts a `level1-level2` path.
    - For `between` / `not_between`, `value` is a two-element array `[min, max]`; matrix / table fields need `{"<column api_code>": [min, max]}`.
    - `within_last` works only on date fields; `value` looks like `{"unit":"day","n":30}` (unit can be minute / day / week / month).
    - `creator_id` is a special field that filters by submitter with `eq` (the value is a user id), and can appear only once.
    - `serial_number` is a special field that filters by serial number with `eq` / `any_in`; several conditions are intersected.
    - For a relation field (RelationField), the `value` of `any_in` / `none_in` is serial numbers of entries in the related table; returns 400 when a serial number does not exist.
    - With a `created_at` condition, results are sorted by creation time instead.
  zh: |
    筛选条件，JSON 数组，每项为 `{"field": "<api_code>", "operator": "<op>", "value": ...}`（`field` 也可写作 `api_code` / `trigger`），多个条件为「且」关系。
    - 操作符全集：`eq` `ne` `any_in` `none_in` `between` `not_between` `null` `not_null` `gte` `gt` `lte` `lt` `like` `not_like` `within_last`，
      别名 `equal` / `not_equal` / `start`（=gte）/ `end`（=lte）。每种字段类型只接受其中一部分，不支持时返回 400 并列出可用操作符。
    - 选项类字段（单选 / 多选 / 下拉 / 多级下拉）的 `value` 可以是选项 api_code 或选项显示值；多级下拉可用 `一级-二级` 路径。
    - `between` / `not_between` 的 `value` 为二元数组 `[min, max]`；矩阵 / 表格字段需写成 `{"<列 api_code>": [min, max]}`。
    - `within_last` 仅日期字段可用，`value` 形如 `{"unit":"day","n":30}`（unit 可为 minute / day / week / month）。
    - `creator_id` 可作为特殊字段用 `eq` 筛选提交人（值为用户 id），且只能出现一次。
    - `serial_number` 可作为特殊字段用 `eq` / `any_in` 按序号筛选，多个条件取交集。
    - 关联字段（RelationField）的 `any_in` / `none_in` 的 `value` 为关联表格中的数据序号；序号不存在时返回 400。
    - 含 `created_at` 条件时结果改为按创建时间排序。
- en: Full-text keyword (at most 200 characters), fuzzy-matched across all searchable fields. Forms with more than 99999 entries and no analytics engine enabled do not support full-text search (returns 400), unless `creator_id` also restricts the submitter.
  zh: 全文关键字（最长 200 字符），在所有可搜索字段中模糊匹配。数据量超过 99999 条且未启用分析引擎的表单不支持全文搜索（返回 400），除非同时用 `creator_id` 限定提交人。
- en: |
    Sort rules, a JSON array of `{"api_code": "<api_code>", "order": "asc"|"desc"}` items, applied in order, with ascending serial number appended automatically at the end.
    Only sortable fields are allowed; otherwise returns 400 listing the sortable fields. With `sort`, `next` becomes a row offset.
  zh: |
    排序规则，JSON 数组，每项 `{"api_code": "<api_code>", "order": "asc"|"desc"}`，按顺序生效，末尾自动追加按序号升序。
    只有可排序字段可用，否则返回 400 并列出可排序字段。传 `sort` 后 `next` 变为行偏移量。
- en: Return only entries created at or after this time (parsed in Beijing time, UTC+8, e.g. `2024-01-01` or `2024-01-01 08:00:00`), sorted by creation time ascending instead. Returns 400 when the format cannot be parsed. Ignored when given together with `filters` / `keyword`.
  zh: 只返回在该时间及之后创建的数据（按北京时间解析，如 `2024-01-01` 或 `2024-01-01 08:00:00`），并改为按创建时间升序。格式无法解析时返回 400。与 `filters` / `keyword` 同时传时忽略。
- en: "`next` from the previous page's response. Under the default sort it is a serial-number cursor (returns entries with serial number ≥ this value); with filters / creation-time ordering / an explicit sort it is a row offset. Cannot be combined with `skip`. Also accepts a string: one starting with an integer is read as that integer, anything else as 0, i.e. starting from the first page."
  zh: 上一页响应中的 `next`。默认排序下是序号游标（返回序号 ≥ 该值的数据）；条件查询 / 按创建时间 / 显式排序时是行偏移量。不能与 `skip` 同时传。也接受字符串：以整数开头时取该整数，否则视为 0，即从第一页开始。
- en: Starting row offset (from 0, max 10000), for reading in parallel slices. Cannot be combined with `next`.
  zh: 起始行偏移（0 起，最大 10000），用于并行切片读取。不能与 `next` 同时传。
- en: |
    When true, each form field value in an entry becomes `{"label": "<field label>", "value": <original value>}`, saving a second read of the form structure.
    System keys (such as `serial_number`, `creator_id`, `token`) and the exam / evaluation `<api_code>_extra_value` stay as they are. Defaults to false.
  zh: |
    为 true 时，每条数据中表单字段的值改为 `{"label": "<字段标题>", "value": <原值>}`，免去再读一次表单结构。
    系统键（如 `serial_number`、`creator_id`、`token`）与考试 / 测评的 `<api_code>_extra_value` 保持原样。缺省为 false。
- en: Page size. Defaults to 50, max 1000 (larger values are treated as 1000). With 0, returns only `total`, and `data` is empty.
  zh: 每页条数，缺省 50，最大 1000（超过按 1000 处理）。传 0 时只返回 `total`，`data` 为空。
- en: Total number of entries matching the conditions
  zh: 满足条件的数据总数
- en: Number of items on this page
  zh: 本页条数
- en: Cursor for the next page (the serial number under the default sort, a row offset otherwise); null on the last page
  zh: 下一页游标（默认排序下为序号，其他情况为行偏移量）；末页为 null
- en: Entry list
  zh: 数据列表
- en: One entry
  zh: 单条数据
- en: What to show after submission
  zh: 提交后展示内容
- en: Show the total score in the report
  zh: 报告中显示总分
- en: Show the radar chart in the report
  zh: 报告中显示雷达图
- en: Show the dimension comments in the report
  zh: 报告中显示维度评语
- en: Show the total-score comments in the report
  zh: 报告中显示总分评语
- en: Instructions shown before the evaluation
  zh: 测评须知
- en: Total-score range comments; returned only when they are on
  zh: 总分区间评语；仅在已开启时返回
- en: id of a condition-based comment; pass this id back when updating
  zh: 按条件编写的评语的 id；更新时按此 id 传回
- en: Conditions of a condition-based comment
  zh: 按条件编写的评语的判定条件
- en: api_code of the condition field
  zh: 条件字段 api_code
- en: Comparison operator
  zh: 比较操作符
- en: Dimension settings; returned only when dimensions exist
  zh: 维度设置；仅在存在维度时返回
- en: How dimensions are scored
  zh: 维度计分方式
- en: Dimension identifier; the dimension score in an entry is stored under indicator_<api_code>
  zh: 维度标识，数据中的维度得分存于 indicator_<api_code>
- en: Standard score; omitted when null
  zh: 标准分；为 null 时省略
- en: One score-range comment; keys whose value is null are omitted
  zh: 一条分数区间评语；值为 null 的键会被省略
- en: Range start, inclusive
  zh: 区间起点（含）
- en: Range end, inclusive; not less than start_point
  zh: 区间终点（含），不小于 start_point
- en: Comment text (rich text)
  zh: 评语内容（富文本）
- en: Whether retaking is allowed
  zh: 是否允许重新作答
- en: Evaluation settings (may be an empty object)
  zh: 测评设置（可能为空对象）
- en: What to show after the exam is handed in
  zh: 交卷后展示内容
- en: Whether the exam is timed
  zh: 是否限时答题
- en: Time limit in minutes
  zh: 限时分钟数
- en: Instructions shown before the exam
  zh: 考前须知
- en: Score-range comments; returned only when score-range comments are on
  zh: 分数区间评语；仅在已开启区间评语时返回
- en: Exam settings (may be an empty object)
  zh: 考试设置（可能为空对象）
- en: Number of rules
  zh: 规则数量
- en: One field display rule
  zh: 一条字段显示规则
- en: List of field display rules
  zh: 字段规则列表
- en: View details
  zh: 视图详情
- en: The next value from the previous page's response (a row offset, starting at 0); a negative value is treated as 0
  zh: 上一页响应中的 next 值（行偏移量，从 0 开始），负数按 0 处理
- en: Number of views returned
  zh: 返回的视图数量
- en: List of views
  zh: 视图列表
- en: Fuzzy match on name (case-insensitive; matches both the public name and the in-product name). Accepts several values (`q[]=A&q[]=B`), matching forms whose name contains any of them. Equivalent to `filters=[{"field":"form_name","operator":"like","value":...}]`.
  zh: 按名称模糊匹配（不区分大小写，同时匹配对外名称与站内名称）。可传多个值（`q[]=A&q[]=B`），匹配名称包含其中任一的表单。等价于 `filters=[{"field":"form_name","operator":"like","value":...}]`。
- en: |
    Filters, a JSON array; conditions are combined with AND. Filterable fields and operators:
    | field | type | operators |
    |---|---|---|
    | `form_name` | text | `eq` `ne` `any_in` `none_in` `like` `not_like` |
    | `created_at` | time | `eq` `ne` `gte` `gt` `lte` `lt` `within_last` |
    | `last_entry_created_at` | time | same as above (forms that have never received an entry have no value) |
    | `entries_count` | integer | `eq` `ne` `gte` `gt` `lte` `lt` |

    The value of `within_last` looks like `{"unit":"day","n":30}` (unit can be minute / day / week / month), meaning the window going back from now.
    Example: `[{"field":"last_entry_created_at","operator":"within_last","value":{"unit":"day","n":7}}]`
  zh: |
    筛选条件，JSON 数组，多个条件为「且」关系。可筛选字段与操作符：
    | field | 类型 | 操作符 |
    |---|---|---|
    | `form_name` | 文本 | `eq` `ne` `any_in` `none_in` `like` `not_like` |
    | `created_at` | 时间 | `eq` `ne` `gte` `gt` `lte` `lt` `within_last` |
    | `last_entry_created_at` | 时间 | 同上（从未收到数据的表单没有该值） |
    | `entries_count` | 整数 | `eq` `ne` `gte` `gt` `lte` `lt` |

    `within_last` 的值形如 `{"unit":"day","n":30}`（unit 可为 minute / day / week / month），表示从现在起往前的窗口。
    示例：`[{"field":"last_entry_created_at","operator":"within_last","value":{"unit":"day","n":7}}]`
- en: |
    Sort rules, a JSON array, each item `{"field": "<field>", "order": "asc"|"desc"}` (order defaults to asc), applied in order.
    Sortable fields: `created_at`, `last_entry_created_at`, `entries_count`; any other field, an invalid order or unparseable JSON returns 400.
    With `sort`, `next` becomes a cursor of the form `row:<offset>`, usable only in requests with the same `sort`; rows with equal values may change order between pages.
  zh: |
    排序规则，JSON 数组，每项 `{"field": "<字段>", "order": "asc"|"desc"}`（order 缺省 asc），按顺序生效。
    可排序字段：`created_at`、`last_entry_created_at`、`entries_count`；其他字段、非法 order 或无法解析的 JSON 返回 400。
    传 `sort` 后 `next` 变为 `row:<偏移量>` 形式的游标，只能用于同样 `sort` 的请求；值相同的行在翻页间可能出现顺序变化。
- en: "`next` from the previous page's response, passed back as is to get the next page. Cannot be combined with `skip`."
  zh: 上一页响应中的 `next`，原样回传以取下一页。不能与 `skip` 同时传。
- en: Starting row offset (from 0, at most 10000), for reading in parallel slices; the returned `next` still pages onward. Cannot be combined with `next`.
  zh: 起始行偏移（0 起，最大 10000），用于并行切片读取；返回的 `next` 仍可继续翻页。不能与 `next` 同时传。
- en: Total number of forms matching the conditions
  zh: 满足条件的表单总数
- en: Form name (the public name)
  zh: 表单名称（对外名称）
- en: Tags the current identity put on this form (for an account token, the union of all members' tags)
  zh: 当前身份为该表单打的标签（企业令牌为所有成员的标签合集）
- en: Entry count of the form
  zh: 表单数据量
- en: When the latest entry was received (UTC); null when the form has never received an entry
  zh: 最近一次收到数据的时间（UTC）；从未收到数据时为 null
- en: Creator's name (nickname when there is no name)
  zh: 创建者姓名（无姓名时为昵称）
- en: "Cursor for the next page: the form id under the default sort, `row:<offset>` when `sort` is given; null on the last page"
  zh: 下一页游标：默认排序下为表单 id，传 `sort` 时为 `row:<偏移量>`；末页为 null
- en: Form list
  zh: 表单列表
- en: ID of the account the user belongs to
  zh: 所属账号 ID
- en: Signed up at (UTC)
  zh: 注册时间（UTC）
- en: Current user
  zh: 当前用户
- en: Filter by form token
  zh: 按表单 token 过滤
- en: Number of queries returned
  zh: 返回的查询数量
- en: Public query list
  zh: 对外查询列表
- en: Public query token (an id is also accepted)
  zh: 对外查询 token（也接受 id）
- en: Public query details
  zh: 对外查询详情
- en: Fields usable as search conditions
  zh: 可作为查询条件的字段
- en: Field label
  zh: 字段标题
- en: Field type name, e.g. TextField, MobileField
  zh: 字段类型名，如 TextField、MobileField
- en: Whether privacy protection is supported
  zh: 是否支持隐私保护
- en: Whether it is a field expanded from an associated form; null for non-associated fields
  zh: 是否为关联表单展开出来的字段，非关联字段为 null
- en: Fields usable as display fields
  zh: 可作为展示字段的字段
- en: Whether the field can be made editable by the person querying
  zh: 是否可设置为查询者可编辑
- en: Whether the field is scorable
  zh: 是否为可计分字段
- en: Recommended search field api_code values (name + mobile; empty when there is no mobile field)
  zh: 推荐的查询字段 api_code（姓名 + 手机，无手机字段时为空）
- en: Recommended display field api_code values (excluding private fields, display-only fields and WeChat fields)
  zh: 推荐的展示字段 api_code（排除隐私字段、仅展示字段与微信字段）
- en: Field suggestions
  zh: 字段建议
- en: Incremental field operations; they take effect only when at least one sub-key is non-empty
  zh: 字段增量操作，至少一个子键非空才生效
- en: Fields to add; each may carry `position` (0-based) to set where it is inserted, otherwise it is appended at the end
  zh: 新增字段；可带 `position`（0 起）指定插入位置，缺省追加到末尾
- en: api_codes of the fields to remove; returns 400 when one does not exist
  zh: 要删除的字段 api_code；不存在时返回 400
- en: Changes an existing field found by api_code, touching only the keys given. A type-specific attribute is accepted only on a type it applies to (the target type when the type changes); a wrong one is refused with the list of settings that type takes
  zh: 按 api_code 定位已有字段做修改，只处理出现的键；类型专属属性写在不适用的类型上会被忽略
- en: Incremental changes to the choices of a choice field (or of a choice column in a matrix / table field); returns 400 when the field does not exist or does not support choices
  zh: 对某个选项类字段（或矩阵 / 表格中的选项列）的选项做增量修改；字段不存在或不支持选项时返回 400
- en: A choice; value and name mean the same, give either
  zh: 选项；value 与 name 等价，任填其一
- en: Choice label
  zh: 选项显示值
- en: Same as value
  zh: 与 value 等价
- en: The choice api_code; generated by the server when left out, and keeps the identity of the choice on edit
  zh: 指定选项 api_code；缺省由服务端生成，编辑时用于保留身份
- en: Maximum number of places; leave out for no limit
  zh: 名额上限；不限名额时省略
- en: Numeric value of the choice
  zh: 选项赋值
- en: Selected by default
  zh: 默认选中
- en: Make this the "Other" choice (choosing it shows a text box); its text is kept as written. A choice whose text is exactly `其他` or `其它` needs no flag. Only for RadioButton / CheckBox / DropDown
  zh: 设为其他选项（选中后出现填写框），文字照原样保留；文字正好是 `其他` 或 `其它` 的选项不用设。只用于 RadioButton / CheckBox / DropDown
- en: 'api_code (or choice label) of a choice to remove; can also be written as `{"api_code": "..."}`'
  zh: '要删除的选项 api_code（或显示值），也可写成 `{"api_code": "..."}`'
- en: New choice label
  zh: 新显示值
- en: Incremental field display rule operations; `remove` / `update` target a rule by the 0-based `index` that `GET /forms/{form_token}/field_rules` returns; the same index cannot be both removed and updated
  zh: 字段规则增量操作，`remove` / `update` 以 `GET /forms/{form_token}/field_rules` 返回的 0 起 `index` 定位；同一 index 不能同时删除和更新
- en: "Used by update only: index of the rule to change (0-based)"
  zh: 仅 update 操作使用：要修改的规则下标（0 起）
- en: api_codes of the affected fields; may be omitted when `targets_display_mode=abort`
  zh: 受影响字段的 api_code；`targets_display_mode=abort` 时可省略
- en: "`show` / `abort`, defaults to show"
  zh: "`show` / `abort`，默认 show"
- en: How the conditions are combined, defaults to or
  zh: 条件之间的关系，默认 or
- en: Comparator, defaults to the first one the field supports; an unsupported one returns 400 listing the available comparators
  zh: 比较符，缺省取该字段支持的第一个；不支持时返回 400 并列出可用比较符
- en: Value to compare with
  zh: 比较值
- en: Updated; returns the form structure
  zh: 更新成功，返回表单结构
- en: Updated; returns the entry
  zh: 更新成功，返回该条数据
- en: Forced to none when the plan does not support evaluation reports
  zh: 套餐不支持测评报告时会被强制写为 none
- en: Replaces the total-score range comments as a whole; an empty array turns range comments off. Ranges must not overlap
  zh: 整体替换总分区间评语；空数组关闭区间评语。区间评语需互不重叠
- en: id of a condition-based comment
  zh: 按条件编写的评语的 id
- en: May be passed back as is; cannot be changed
  zh: 可原样传回，不可改动
- en: Dimension settings; indicators is replaced as a whole
  zh: 维度设置；indicators 整体替换
- en: Pass back an existing dimension's api_code to keep its identity; omit it for a new dimension
  zh: 传回已有维度的 api_code 以保留其身份；新维度可省略
- en: api_codes of the bound questions; each must be a visible, scorable question on the form
  zh: 绑定的题目 api_code，必须是表单上可见的可计分题目
- en: Questions can also be referenced by cid (a number or a string)
  zh: 也可用题目 cid 引用（可为数字或字符串）
- en: Dimension range comments (retry is not supported)
  zh: 维度区间评语（不支持 retry）
- en: The saved evaluation settings
  zh: 保存后的测评设置
- en: Forced to none when the plan does not support showing scores
  zh: 套餐不支持显示成绩时会被强制写为 none
- en: "Turns on the exam time limit. Mutually exclusive with required on exam question fields: passing true returns 400 when the form already has a required question; once on, question fields can no longer be set as required (required on examinee info fields is unaffected)"
  zh: 开启限时答题。与考试题目字段的 required 互斥：表单已有必填题目时传 true 返回 400；开启后题目字段不能再设必填（考生信息字段的必填不受影响）
- en: Rich-text message shown after the exam is handed in; written only when the plan supports showing scores
  zh: 交卷后提示富文本；仅套餐支持显示成绩时写入
- en: Replaces the score-range comments as a whole; ranges must not overlap. Takes effect only when notice_after_filling_mode is grade / explaination / answer; an empty array is ignored
  zh: 整体替换区间评语；需互不重叠。仅 notice_after_filling_mode 为 grade / explaination / answer 时生效，空数组被忽略
- en: Not less than start_point
  zh: 不小于 start_point
- en: The saved exam settings
  zh: 保存后的考试设置
- en: Target folder token; null moves the form out of its folder
  zh: 目标文件夹 token；null 表示移出文件夹
- en: Token of the folder it is in after the move; null when moved out of folders
  zh: 移动后所在文件夹 token；移出时为 null
- en: Move result
  zh: 移动结果
- en: Primary color, e.g. "#FBBF24"
  zh: 主色，如 "#FBBF24"
- en: Secondary color
  zh: 辅色
- en: Page background
  zh: 页面背景
- en: The server fetches this URL and uses it as the background image
  zh: 服务端抓取该 URL 作为背景图
- en: The `form_image_token` used by "Upload a form image"; the image purpose must be wallpaper; takes precedence over background_image_url
  zh: 「上传表单图片」使用的 `form_image_token`，图片用途须为 wallpaper；优先于 background_image_url
- en: attachment_id returned by "Upload a form image" (image_type=wallpaper); an empty string removes the current background image. Lower priority than background_image_upload_token / background_image_url
  zh: 「上传表单图片」（image_type=wallpaper）返回的 attachment_id；传空字符串移除当前背景图。优先级低于 background_image_upload_token / background_image_url
- en: Header
  zh: 表头
- en: Header text
  zh: 表头文字
- en: Text style; keys use underscores (e.g. font_size, text_align) and are merged into the existing style
  zh: 文字样式，键使用下划线（如 font_size、text_align），与现有样式合并
- en: The server fetches this URL and uses it as the header image
  zh: 服务端抓取该 URL 作为头图
- en: Base64-encoded header image; takes precedence over header_image_url
  zh: base64 编码的头图；优先于 header_image_url
- en: The `form_image_token` used by "Upload a form image"; the image purpose must be header; highest priority
  zh: 「上传表单图片」使用的 `form_image_token`，图片用途须为 header；优先级最高
- en: Carousel images; replaced as a whole and shown in array order
  zh: 轮播图，整体替换，按数组顺序展示
- en: The `form_image_token` used by "Upload a form image"; the image purpose must be carousel
  zh: 「上传表单图片」使用的 `form_image_token`，图片用途须为 carousel
- en: Keeps an existing carousel image of this form
  zh: 保留该表单已有的轮播图
- en: attachment_id returned by "Upload a form image" (image_type=header); an empty string removes the current header image. Lowest priority; header.type is set to image when not given
  zh: 「上传表单图片」（image_type=header）返回的 attachment_id；传空字符串移除当前头图。优先级最低；未指定 header.type 时自动设为 image
- en: Typography; keys use underscores and are merged into the existing style
  zh: 字体样式；各项键使用下划线并与现有样式合并
- en: Border color of the form container, e.g. "#E5E7EB"
  zh: 表单容器边框颜色，如 "#E5E7EB"
- en: Border width of the form container, e.g. "1px"
  zh: 表单容器边框宽度，如 "1px"
- en: e.g. "16px"
  zh: 如 "16px"
- en: Generates a header image with AI and sets it as the header image; uses AI points
  zh: 调用 AI 生成头图并设置为 header 图片；消耗 AI 点数
- en: Prompt for the image; when omitted, AI writes one from the form's content
  zh: 生成提示词；省略时由 AI 根据表单内容生成
- en: CSS hyphenated keys
  zh: CSS 连字符键
- en: The saved theme
  zh: 保存后的主题
- en: Updated; returns the view
  zh: 更新成功，返回视图
- en: "Used on create only: token of the form the query belongs to (can also be passed as a query parameter)"
  zh: 仅创建时使用：所属表单的 token（也可作为 query 参数传递）
- en: Updated; returns the public query details
  zh: 更新成功，返回对外查询详情
