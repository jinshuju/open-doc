name: Sync openapi.yaml

# Once a day the published openapi.yaml is fetched. When it differs from
# spec/openapi.yaml, the generated parts of the API pages are rewritten from it
# and a pull request opened, so what API v1 now does reaches the docs through
# review rather than through a reader's failed request.
#
# Only what the spec says is generated: the parameter, response and status
# tables between `<!-- openapi:… -->` markers. Which endpoints have a page, and
# everything else on it, stays the docs' decision.
#
# A pull request is opened even when the pages do not pass against the new
# spec, and says so. That is the case that needs a person most: a description
# with no Chinese yet, an operation a page documents was removed, or a body
# example the API no longer takes. The run then fails as well, so it does not
# pass unnoticed.
on:
  schedule:
    - cron: '23 1 * * *' # 09:23 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: spec-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Fetch openapi.yaml and open a pull request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch openapi.yaml
        shell: bash
        run: |
          cp spec/openapi.yaml "${RUNNER_TEMP}/openapi.before.yaml"
          node scripts/fetch-spec.mjs

      - name: Regenerate the API pages
        id: generate
        continue-on-error: true
        shell: bash
        run: npm run generate -- --gaps 2>&1 | tee "${RUNNER_TEMP}/generate.log"

      - name: Build the site
        id: build
        continue-on-error: true
        shell: bash
        run: npm run build 2>&1 | tail -n 60 | tee "${RUNNER_TEMP}/build.log"

      - name: Describe the change
        id: describe
        shell: bash
        env:
          GENERATED: ${{ steps.generate.outcome }}
          BUILT: ${{ steps.build.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A page that changed is a docs change readers see; a spec that moved
          # only where no page looks is a chore.
          pages="$(git diff --name-only -- docs | wc -l | tr -d ' ')"
          if [ "${pages}" != '0' ]; then
            title="docs(api_v1): follow openapi.yaml in ${pages} page(s)"
          else
            title='chore: sync openapi.yaml, no page changed'
          fi
          delimiter="EOF_$(openssl rand -hex 8)"
          {
            echo "title=${title}"
            echo "body<<${delimiter}"
            echo 'The published openapi.yaml changed, and the generated parts of the API pages were rewritten from it.'
            echo
            if [ "${pages}" != '0' ]; then
              echo 'Pages changed:'
              git diff --name-only -- docs | sed 's/^/- `/; s/$/`/'
              echo
            fi
            node scripts/spec-diff.mjs "${RUNNER_TEMP}/openapi.before.yaml" spec/openapi.yaml ||
              echo '- The two copies could not be compared; read the diff of `spec/openapi.yaml`.'
            echo
            if [ "${GENERATED}" != 'success' ]; then
              echo '**The pages do not pass against the new spec.** Fix it on this branch before merging:'
              echo 'a string with an empty `zh` in `spec/openapi.zh-Hans.yaml` needs its Chinese, then run `npm run generate`.'
              echo
              echo '```'
              sed -n '/^- /,$p' "${RUNNER_TEMP}/generate.log" | head -n 60
              echo '```'
            elif [ "${BUILT}" != 'success' ]; then
              echo '**The site does not build with the regenerated pages:**'
              echo
              echo '```'
              grep -iE 'error|failed' "${RUNNER_TEMP}/build.log" | head -n 30 || true
              echo '```'
            else
              echo '`npm run generate -- --check` and `npm run build` pass against the new spec.'
            fi
            echo
            echo '<details><summary>Rows openapi.yaml gives no description (fix them in openapi.yaml)</summary>'
            echo
            echo '```'
            sed -n '/have no description/,/^$/p' "${RUNNER_TEMP}/generate.log" | sed -n '2,200p' | grep '^  ' || true
            echo '```'
            echo '</details>'
            echo
            echo "Run: ${RUN_URL}"
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"

      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@v7
        with:
          # A pull request opened with GITHUB_TOKEN does not trigger other
          # workflows, so CI would not run on it. A token with contents and
          # pull-requests write in SPEC_SYNC_TOKEN fixes that; without it the
          # pull request still opens and simply shows no checks.
          token: ${{ secrets.SPEC_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          branch: chore/sync-openapi
          commit-message: ${{ steps.describe.outputs.title }}
          title: ${{ steps.describe.outputs.title }}
          body: ${{ steps.describe.outputs.body }}
          labels: openapi-sync
          delete-branch: true

      - name: Fail the run when the pages do not follow the new spec
        if: steps.generate.outcome != 'success' || steps.build.outcome != 'success'
        run: |
          echo '::error::the API pages do not pass against the new openapi.yaml; see the pull request'
          exit 1
