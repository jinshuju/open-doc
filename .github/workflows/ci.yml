name: CI

# The generated parts of the API pages must be what spec/openapi.yaml and
# spec/openapi.zh-Hans.yaml say, every description must have its Chinese, and
# the hand-written request examples must be ones the API takes. Then the site
# must build.
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    name: Generated pages and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the API pages against openapi.yaml
        run: npm run generate:check

      - name: Build website
        run: npm run build
