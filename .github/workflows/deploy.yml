name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 需要 Node 22：构建脚本用 --experimental-strip-types 直接 import sidebars.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 站点没有运行时依赖，装的这些只是给 test/check-snippets.mjs
      # 真的把生成的 Python 片段跑一遍用的
      - name: Install check dependencies
        run: pip install --quiet requests pyjwt

      - name: Build site
        run: npm run build

      - name: Run checks
        run: npm test

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
